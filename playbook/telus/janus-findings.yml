# 
- hosts: 127.0.0.1
  connection: local
  gather_facts: False
  vars:
    janus_issues_url: http://telusepcpoc.cisco.com:8084/issues
    issues_file_path: ./issues.html
  tasks:
  - name: Get Issues Table from Janus Control Page
    ansible.builtin.uri:
      url:  "{{ janus_issues_url }}"
      return_content: true
      dest: "{{ issues_file_path }}"

      
  - name: Building Janus Issues Summarization
    ansible.builtin.shell:
      cmd: "python3 /home/scripts/Janus/JanusIssuesParser.py {{ issues_file_path }} -o /home/output/janus-parsed-issues.csv -s /home/output/janus-parsed-issues-summary.csv"


  - name: Delete issues_file_path
    ansible.builtin.file:
      state: absent
      path: "{{ issues_file_path }}"
